<div class="gems-input-container">
  @if (label()) {
  <label [for]="inputId()" class="gems-label" [class.gems-required]="required()">
    {{ label() }}
  </label>
  }

  <div class="gems-password-wrapper">
    <input
      [type]="showPassword() ? 'text' : 'password'"
      [id]="inputId()"
      class="gems-input"
      [placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-describedby]="shouldShowCriteria() ? criteriaId() : null"
      (input)="onInput($event)"
      (blur)="markTouched()"
    />
    <button
      type="button"
      class="gems-toggle-btn"
      tabindex="-1"
      [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Exibir senha'"
      [attr.aria-pressed]="showPassword()"
      (click)="togglePasswordVisibility()"
    >
      <i
        class="fa-solid"
        [class.fa-eye]="!showPassword()"
        [class.fa-eye-slash]="showPassword()"
      ></i>
    </button>
  </div>

  @if (shouldShowCriteria() && unmetCriteria().length > 0) {
  <ul class="gems-password-criteria" [id]="criteriaId()" aria-live="polite">
    @for (criterion of unmetCriteria(); track criterion.key) {
    <li>
      <i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>
      {{ criterion.message }}
    </li>
    }
  </ul>
  }
</div>
