<div class="gems-input-container">
  @if (label()) {
  <label [for]="id()" class="gems-label" [class.gems-required]="required()">{{ label() }}</label>
  }

  <div class="gems-data-wrapper">
    <i
      class="fa-regular fa-calendar gems-input-icon gems-clickable"
      role="button"
      [attr.tabindex]="disabled() ? -1 : 0"
      [attr.aria-disabled]="disabled()"
      aria-label="Abrir seletor de data"
      (click)="toggleDatePicker()"
      (keydown.enter)="toggleDatePicker()"
      (keydown.space)="$event.preventDefault(); toggleDatePicker()"
    ></i>

    <input
      type="text"
      [id]="id()"
      class="gems-input gems-with-icon"
      [placeholder]="internalPlaceholder()"
      [value]="displayValue()"
      [disabled]="disabled()"
      [required]="required()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    @if (resolvedFormat() !== 'year') {
    <input
      #nativeInput
      [type]="getNativeType()"
      class="gems-hidden-native-input"
      [attr.aria-label]="label().trim() || placeholder().trim() || 'Data'"
      [value]="value()"
      [disabled]="disabled()"
      (change)="onNativeChange($event)"
    />
    }
  </div>
</div>
